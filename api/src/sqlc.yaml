version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations"
      - "sql/schema.sql"
    queries: "sql/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_interface: false
        omit_unused_structs: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/acienciadalua/api/internal/types"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/acienciadalua/api/internal/types"
              type: "NullDecimal"
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "github.com/acienciadalua/api/internal/types"
              type: "Timestamp"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "github.com/acienciadalua/api/internal/types"
              type: "Timestamp"
              pointer: true
