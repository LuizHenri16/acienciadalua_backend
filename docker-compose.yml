services:
  db:
    image: postgres:15
    container_name: acienciadalua-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      target: development
    container_name: acienciadalua-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # Dentro do container o host do Postgres e "db" (o .env aponta para localhost)
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      - NODE_ENV=development
      # Sem isso o Node enxerga o limite do cgroup (512M/1G) e capa o heap em
      # ~256MB, o que derruba o `nest start --watch` com "heap out of memory".
      - NODE_OPTIONS=--max-old-space-size=768
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - ./.env:/app/.env
      - ./uploads:/app/uploads
      - ./files:/app/files
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── API em Go (port do NestJS) ─────────────────────────────────────────────
  # Roda em paralelo com a API Node para validação. O profile "go" evita que ela
  # suba em `docker compose up` sem intenção:
  #
  #   docker compose --profile go up -d api-go
  #
  # A porta 3000 continua sendo da API Node; a versão Go expõe 3001 por padrão
  # (ajuste com API_GO_PORT no .env para comparar respostas lado a lado).
  api-go:
    profiles: ["go"]
    build:
      context: ./api/src
      target: production
    container_name: acienciadalua-api-go
    restart: always
    ports:
      - "${API_GO_PORT:-3001}:3000"
    environment:
      # Dentro do container o host do Postgres é "db". A API remove o
      # ?schema=public antes de conectar (pgx não conhece esse parâmetro).
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - JWT_SECRET_CUSTOMER=${JWT_SECRET_CUSTOMER}
      - APP_URL=${APP_URL:-http://localhost:3001}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_SENDER_ADDRESS=${EMAIL_SENDER_ADDRESS:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN:-}
      - MP_WEBHOOK_URL=${MP_WEBHOOK_URL:-}
      - MP_SUCCESS_URL=${MP_SUCCESS_URL:-}
      - MP_FAILURE_URL=${MP_FAILURE_URL:-}
      - MP_PENDING_URL=${MP_PENDING_URL:-}
      # Migrations embutidas no binário (idempotentes sobre bases do Prisma).
      - RUN_MIGRATIONS=true
    volumes:
      - ./uploads:/app/uploads
      - ./files:/app/files
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  # Dependências instaladas na imagem de desenvolvimento. Volume nomeado para
  # poder ser recriado com `docker volume rm acienciadalua_backend_api_node_modules`
  # quando o package.json mudar.
  api_node_modules:
